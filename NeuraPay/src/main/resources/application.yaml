spring:
  application:
    name: DheerX-Pay
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dheerx_pay_db}
    username: ${DB_USERNAME:dheerx_user}
    password: ${DB_PASSWORD:Dheerx@123}
